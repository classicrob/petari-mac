name: Native macOS (Apple Silicon)

# Builds the native port and runs its tests that need no game data or GPU-heavy
# full-game runs. Game data is never available in CI.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Aurora needs std::jthread/std::stop_token: Xcode 26's libc++. The macos-15
    # image defaults to Xcode 16.4 (Apple clang 17), which lacks them.
    runs-on: macos-26  # arm64
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$xcode" ]; then echo "::error::no Xcode 26 on this runner image"; ls -d /Applications/Xcode*.app; exit 1; fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          clang --version
          printf '#include <thread>\n#include <stop_token>\nint main(){std::jthread t([](std::stop_token){});}\n' > jthread.cpp
          clang++ -std=c++20 jthread.cpp -o jthread || { echo "::error::this toolchain lacks std::jthread (Aurora needs it)"; exit 1; }

      - name: Dependencies
        run: brew install sqlite

      - name: Configure
        run: >
          cmake -S . -B build/macos-gx
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DPETARI_BUILD_GX_PROBE=ON
          -DCMAKE_PREFIX_PATH="$(brew --prefix sqlite)"

      - name: Build
        run: |
          cmake --build build/macos-gx -j "$(sysctl -n hw.ncpu)"
          cmake --build build/macos-gx --target petari petari_tests -j "$(sysctl -n hw.ncpu)"

      - name: Test
        # Tests that read the extracted disc are only registered when
        # build/game-data/RMGE01 exists, so CI runs the data-free set. Serial,
        # because some timing tests are sensitive to noisy shared runners.
        run: ctest --test-dir build/macos-gx --output-on-failure --timeout 600

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-log
          path: build/macos-gx/Testing/Temporary/LastTest.log
